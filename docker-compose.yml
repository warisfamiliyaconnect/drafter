version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./ai_engine/models:/app/ai_engine/models
    environment:
      - PYTHONPATH=/app
    networks:
      - drafter-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - drafter-network

networks:
  drafter-network:
    driver: bridge
