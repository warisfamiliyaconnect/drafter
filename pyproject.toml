[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drafter"
version = "0.1.0"
description = "Local LLM-powered professional drafting system with adaptive reasoning."
authors = [
    {name = "Waris", email = "waris@example.com"}
]
dependencies = [
    "llama-cpp-python>=0.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "grpcio>=1.66.0",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "loguru>=0.7.2",
    "python-docx>=1.2.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "black",
    "isort",
    "flake8",
]
